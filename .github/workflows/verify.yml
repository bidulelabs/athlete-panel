name: Verify application
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm check

  local-setup-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Rehearse guided local setup and combined startup on isolated storage
        run: python3 scripts/rehearse-local.py

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres: &test-postgres
        image: postgres:17-alpine
        env:
          POSTGRES_USER: athlete_panel_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: athlete_panel_test
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U athlete_panel_test -d athlete_panel_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env: &test-env
      DATABASE_URL: postgres://athlete_panel_test:synthetic-test-only@127.0.0.1:55439/athlete_panel_test
      TEST_DATABASE_URL: postgres://athlete_panel_test:synthetic-test-only@127.0.0.1:55439/athlete_panel_test
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: 'false'
      E2E_DATABASE_URL: postgres://athlete_panel_test:synthetic-test-only@127.0.0.1:55439/athlete_panel_ui_test
      E2E_PASSWORD: AthletePanel-demo-only-2026
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      ATHLETE_PANEL_E2E: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm db:migrate
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    services:
      postgres: *test-postgres
    env: *test-env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Seed and start isolated production server
        env:
          DATABASE_URL: postgres://athlete_panel_test:synthetic-test-only@127.0.0.1:55439/athlete_panel_ui_test
        run: |
          PGPASSWORD=synthetic-test-only createdb -h 127.0.0.1 -p 55439 -U athlete_panel_test athlete_panel_ui_test
          pnpm db:migrate
          ATHLETE_PANEL_DEMO=true pnpm demo:seed
          mkdir -p apps/web/.next/standalone/apps/web/.next
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          HOSTNAME=127.0.0.1 PORT=3000 node apps/web/.next/standalone/apps/web/server.js > /tmp/athlete-panel-web.log 2>&1 &
          for attempt in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi; sleep 1; done
          cat /tmp/athlete-panel-web.log
          exit 1
      - run: pnpm test:e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: verification-evidence-${{ matrix.project }}
          path: |
            .runtime/playwright-report
            .runtime/playwright-results

  verify:
    if: always()
    needs: [check, local-setup-rehearsal, integration, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  publication-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/security
      - name: Inspect exact release tree
        run: python3 scripts/publication-check.py --ref HEAD
      - name: Scan complete reachable Git history with redacted output
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --log-opts=--all --redact=100 --no-banner
      - name: Scan locked dependencies locally
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --include-dev-deps --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src
  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Add synthetic private files to test image exclusions
        run: python3 scripts/packaging-fixtures.py create
      - name: Build and inspect build-stage candidate
        run: |
          docker build --platform linux/amd64 --build-arg ATHLETE_PANEL_COMMIT="$GITHUB_SHA" --target build -t athlete-panel:build-check .
          python3 scripts/packaging-fixtures.py verify --image athlete-panel:build-check
      - name: Build and inspect runtime candidate
        run: |
          docker build --platform linux/amd64 --build-arg ATHLETE_PANEL_COMMIT="$GITHUB_SHA" -t athlete-panel:release-check .
          python3 scripts/packaging-fixtures.py verify --image athlete-panel:release-check
          python3 scripts/release-ci.py export --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: .runtime/release-candidate/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  container-rehearsal:
    name: container-rehearsal (${{ matrix.rehearsal }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: container-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - rehearsal: release
            title: Rehearse clean installation, HTTPS, restart and recovery
          - rehearsal: hosted
            title: Rehearse guided VPS install, schema upgrade, resume and full recovery
          - rehearsal: hosted-registry
            title: Rehearse release bundle, registry upgrades and image recovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: .runtime/release-candidate
      - name: Authenticate shared image identity and checksum
        run: python3 scripts/release-ci.py verify --commit "$GITHUB_SHA"
      - name: ${{ matrix.title }}
        env:
          REHEARSAL: ${{ matrix.rehearsal }}
        run: python3 scripts/release-ci.py rehearse --kind "$REHEARSAL" --commit "$GITHUB_SHA"
      - name: Scan container OS and installed dependencies locally
        if: matrix.rehearsal == 'release'
        run: |
          docker run --rm -v "$PWD/.runtime/release-candidate:/scan:ro" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-evidence-${{ matrix.rehearsal }}
          path: .runtime/release-evidence/
          if-no-files-found: error
  container-installation:
    if: always()
    needs: [container-build, container-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  publish-release:
    if: github.repository == 'bidulelabs/athlete-panel' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, publication-security, container-installation, container-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: .runtime/release-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: .runtime/release-evidence
      - name: Publish the verified artifact and immutable deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/release-ci.py publish --commit "$GITHUB_SHA" --repository bidulelabs/athlete-panel --tag "$RELEASE_TAG"
