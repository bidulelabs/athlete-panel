name: ${ATHLETE_PANEL_LOCAL_PROJECT:-athlete-panel-local}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athlete_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-athlete_panel}
    ports:
      - '127.0.0.1:${ATHLETE_PANEL_LOCAL_DB_PORT:-55440}:5432'
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  database:
    labels:
      com.athlete-panel.local: 'true'
